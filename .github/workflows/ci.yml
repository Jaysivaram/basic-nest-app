name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Check Docker Version
        run: docker --version

      - name: Build Docker Image
        run: docker build -t nestapp-ci:latest .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name nestapp-ci \
            -e PORT=3000 \
            -p 3000:3000 \
            nestapp-ci:latest

      - name: Check Container Status
        run: docker ps -a

      - name: Check Container Logs
        run: docker logs nestapp-ci

      - name: Check Application Inside Container
        run: |
          docker exec nestapp-ci \
            sh -c "wget -qO- http://127.0.0.1:3000 || true"

      - name: Inspect Container
        run: docker inspect nestapp-ci

      - name: Wait for Application
        run: |
          echo "Waiting for application..."
          sleep 10

      - name: Test Application
        run: curl --fail http://localhost:3000