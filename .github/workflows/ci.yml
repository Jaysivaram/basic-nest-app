name: CI

on: 
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node .jobs
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
      
      - name: Build Application
        run: npm run build

      - name: Check Docker Version
        run: docker --version
      
      - name: Build docker image
        run: docker build -t nestapp-ci:latest .

      - name: Run Docker Container
        run: docker run -d --name nestapp-ci -p 3000:3000 nestapp-ci:latest

      - name: Wait for Application
        run: sleep 10

      - name: Test application
        run: curl --fail http://localhost:3000
